name: Build Super Mario Odyssey IPA

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: 'Google Drive Link or Direct Download URL for Super Mario Odyssey'
        required: true
      game_folder:
        description: 'Folder name'
        required: true
        default: 'SuperMarioOdyssey'

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Homebrew & Dependencies
        run: |
          brew install xcodegen zstd spirv-cross glslang
          brew install --cask dotnet-sdk
          python3 -m pip install --break-system-packages lz4 capstone fonttools gdown "backports.zstd; python_version < '3.14'"

      - name: Setup Keys and Game Directory
        run: |
          mkdir -p ~/.keys
          mkdir -p ~/Games/${{ github.event.inputs.game_folder }}
          echo "${{ secrets.PROD_KEYS }}" > ~/.keys/prod.keys
          
          if [ ! -s ~/.keys/prod.keys ]; then
            echo "ERROR: PROD_KEYS secret is empty or not found in Repository Secrets!"
            exit 1
          fi

      - name: Download Game File
        run: |
          echo "Downloading game file..."
          # Directly download the Google Drive file using gdown
          gdown "${{ github.event.inputs.game_url }}" -O ~/Games/${{ github.event.inputs.game_folder }}/SuperMarioOdyssey.nsp
          
          FILESIZE=$(wc -c < "$HOME/Games/${{ github.event.inputs.game_folder }}/SuperMarioOdyssey.nsp" | tr -d ' ')
          if [ "$FILESIZE" -lt 100000000 ]; then
            echo "ERROR: Downloaded file is too small ($FILESIZE bytes). Ensure your Google Drive link has 'Anyone with the link' sharing enabled!"
            exit 1
          fi

      - name: Run Build Script
        run: |
          python3 scripts/build_ipa_from_nsp.py ~/Games/${{ github.event.inputs.game_folder }} -k ~/.keys/prod.keys

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperMarioOdyssey-IPA
          path: ~/Games/**/*.ipa
